<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slate Support — FAQ</title>
  <meta name="description" content="Slate Support — Frequently Asked Questions." />
  <meta property="og:title" content="Slate Support — FAQ" />
  <meta property="og:description" content="Slate Support — Frequently Asked Questions." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://slatetasks.com/support/" />
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="nav-shell">
    <nav class="nav">
      <div class="nav-left">
        <div class="logo-pill">
          <img src="/assets/slate-icon-256.png" alt="Slate app icon" class="logo-mark" />
          <span class="logo-name">Slate</span>
        </div>
      </div>
      <div class="nav-right" aria-hidden="true"></div>
    </nav>
  </header>

  <main class="support-page">
    <div class="support-container">
      <div>
        <p class="badge">Support</p>
        <h1>Frequently Asked Questions</h1>
        <p class="lead">Find quick answers about using Slate with your Obsidian vault. If you need more help, contact us from inside the app.</p>
      </div>
      <section class="faq-list" id="faq">
        <p class="lead" data-faq-status>Loading FAQs…</p>
        <noscript>
          <p class="lead">FAQs require JavaScript to load.</p>
        </noscript>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <nav class="footer-nav" aria-label="Footer">
      <a href="/privacy/">Privacy</a>
    </nav>
  </footer>

  <script>
    (() => {
      const container = document.getElementById('faq');
      if (!container) return;

      const source = '/support/faq.json';

      const renderStatus = (message) => {
        container.innerHTML = '';
        const p = document.createElement('p');
        p.className = 'lead';
        p.textContent = message;
        container.appendChild(p);
      };

      const renderFaq = (items) => {
        container.innerHTML = '';
        if (!Array.isArray(items) || items.length === 0) {
          renderStatus('No FAQs yet. Please check back soon.');
          return;
        }

        items.forEach((item, index) => {
          const details = document.createElement('details');
          details.className = 'faq-item';
          if (item && typeof item.id === 'string' && item.id.trim().length > 0) {
            details.id = item.id.trim();
          }
          if ((item && item.defaultOpen === true) || (index === 0 && !items.some((x) => x && x.defaultOpen === true))) {
            details.open = true;
          }

          const summary = document.createElement('summary');
          summary.textContent = (item && item.question) ? String(item.question) : '';

          const answer = document.createElement('p');
          answer.textContent = (item && item.answer) ? String(item.answer) : '';

          details.appendChild(summary);
          details.appendChild(answer);
          container.appendChild(details);
        });
      };

      fetch(source, { headers: { Accept: 'application/json' } })
        .then((response) => {
          if (!response.ok) throw new Error('FAQ request failed');
          return response.json();
        })
        .then((data) => renderFaq(data && data.items))
        .catch(() => {
          renderStatus('Unable to load FAQs right now. Please try again later.');
        });
    })();
  </script>
</body>
</html>
